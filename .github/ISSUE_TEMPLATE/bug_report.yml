name: Bug report
description: Report reproducible incorrect plugin behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For security issues, use the private reporting link instead of this form.
  - type: checkboxes
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: vite-version
    attributes:
      label: Vite version
      placeholder: 8.2.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.18.0
    validations:
      required: true
  - type: input
    id: package-manager
    attributes:
      label: Package manager and version
      placeholder: pnpm 11.18.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, or Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a minimal repository or provide the smallest complete steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant Vite and StyleX configuration
      render: typescript
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include relevant logs, emitted snippets, or other details.
