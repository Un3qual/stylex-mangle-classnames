name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Verify OIDC availability
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub did not provide the OIDC environment required for npm trusted publishing"
            exit 1
          fi
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}"
            exit 1
          fi
      - name: Check published version
        id: registry
        run: |
          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          ERROR_FILE="$(mktemp)"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>"${ERROR_FILE}"; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          elif grep -q "E404" "${ERROR_FILE}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${ERROR_FILE}" >&2
            exit 1
          fi
      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public
